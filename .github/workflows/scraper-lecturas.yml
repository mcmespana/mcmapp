name: Scraper Lecturas Diario

on:
  schedule:
    # UN solo disparo diario: 00:10 UTC = 01:10 en España en invierno (CET) y
    # 02:10 en verano (CEST). Las dos horas cumplen lo único que se pedía —que
    # ya haya pasado la 1:00 en España—, así que no hace falta un segundo cron
    # para el horario de verano.
    #
    # Antes había dos (00:10 y 23:10 UTC) porque GitHub no entiende el cambio
    # de hora, y un job previo comprobaba la estación para descartar el disparo
    # sobrante. Eso significaba DOS runs al día, uno de ellos siempre tirado a
    # la basura, más un runner extra en el que sí valía. El scraper ya resuelve
    # por su cuenta qué día es en Europe/Madrid (--date por defecto = hoy en
    # Madrid), así que la hora exacta dentro de la madrugada le da igual.
    - cron: "10 0 * * *"

  workflow_dispatch:
    inputs:
      date:
        description: "Fecha base (YYYY-MM-DD). Vacío = hoy en Europe/Madrid."
        required: false
        default: ""
      dry_run:
        description: "Dry-run: scraping sin escribir en Firebase"
        required: false
        type: boolean
        default: false
      backfill_dominicos:
        description: "Backfill Dominicos: procesa -30..+30 días ignorando skip_existing"
        required: false
        type: boolean
        default: false
      cleanup_only:
        description: "Solo limpiar fechas antiguas, sin scraping"
        required: false
        type: boolean
        default: false

jobs:
  scrape:
    name: Scrape y guardar en Firebase
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scraper-lecturas/requirements.txt

      - name: Instalar dependencias
        working-directory: scraper-lecturas
        run: pip install -r requirements.txt

      - name: Tests
        working-directory: scraper-lecturas
        run: |
          pip install -r requirements-dev.txt
          python -m pytest tests/ -q

      - name: Ejecutar scraper
        working-directory: scraper-lecturas
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_DATABASE_URL: ${{ secrets.EXPO_PUBLIC_FIREBASE_DATABASE_URL }}
          INPUT_DATE: ${{ github.event.inputs.date }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
          INPUT_BACKFILL: ${{ github.event.inputs.backfill_dominicos }}
          INPUT_CLEANUP_ONLY: ${{ github.event.inputs.cleanup_only }}
        run: |
          ARGS=""
          if [ -n "$INPUT_DATE" ]; then
            ARGS="$ARGS --date $INPUT_DATE"
          fi
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "$INPUT_BACKFILL" = "true" ]; then
            ARGS="$ARGS --backfill-dominicos"
          fi
          if [ "$INPUT_CLEANUP_ONLY" = "true" ]; then
            ARGS="$ARGS --cleanup-only"
          fi
          python main.py $ARGS

      - name: Resumen en caso de fallo
        if: failure()
        run: |
          echo "::error::El scraper de lecturas falló."
          echo "::error::Revisar logs. Si hay HTTP 403/429 en Dominicos, posible rate-limit."
          echo "::error::Si VidaNueva da 403, ver README.md en scraper-lecturas/."
          echo "::error::Para backfill manual: workflow_dispatch con backfill_dominicos=true."
