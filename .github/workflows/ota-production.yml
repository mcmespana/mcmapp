# .github/workflows/ota-production.yml
name: OTA Production

on:
  push:
    branches: [production]
  workflow_dispatch:
    inputs:
      force:
        description: 'Saltar el guard de cambios nativos (usar solo si sabes lo que haces)'
        type: boolean
        default: false

concurrency:
  group: ota-production
  cancel-in-progress: false

jobs:
  # Una OTA manda solo el bundle JS. Si el bundle referencia módulos nativos que
  # el binario instalado no lleva, la app CRASHEA en toda la base instalada y no
  # se puede arreglar por OTA (hace falta release de tienda). Este job es la red:
  #
  #   - Diff nativo + [skip-ota] en CUALQUIER commit del push → skip=true, no se
  #     publica (comportamiento deseado, pero ahora mira el push entero y no solo
  #     el mensaje del último commit, como hacía el `if:` que había aquí antes).
  #   - Diff nativo SIN [skip-ota] → el guard falla en ROJO. Es exactamente la
  #     situación que antes pasaba desapercibida.
  #   - Sin diff nativo → adelante.
  #   - workflow_dispatch: el guard corre igual (comparando HEAD^..HEAD), así que
  #     deja de ser un bypass silencioso; para saltárselo hay que pedirlo con el
  #     input `force`.
  guard-native:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.guard.outputs.skip }}
    steps:
      - name: Checkout código (historia completa para poder diffear el push)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detectar cambios en rutas nativas
        id: guard
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail

          if [ "${FORCE}" = "true" ]; then
            echo "Dispatch manual con force=true → se salta el guard de nativos."
            exit 0
          fi

          AFTER="${AFTER_SHA}"
          BEFORE="${BEFORE_SHA:-}"
          # Rama nueva, primer push o force-push: `before` no existe en el repo.
          # Se compara entonces con el commit anterior (o con el árbol vacío si
          # no hay padre, p. ej. commit inicial).
          if [ -z "${BEFORE}" ] \
            || [ "${BEFORE}" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "${BEFORE}" 2>/dev/null; then
            BEFORE="$(git rev-parse "${AFTER}^" 2>/dev/null \
              || git hash-object -t tree /dev/null)"
          fi
          echo "Rango del push: ${BEFORE}..${AFTER}"

          # MANTENIMIENTO: si aparece un directorio nativo nuevo (p. ej.
          # mcm-app/widgets/), hay que añadirlo aquí Y en ota-preview.yml.
          NATIVE_CHANGES=$(git diff --name-only "${BEFORE}" "${AFTER}" -- \
            mcm-app/package.json mcm-app/package-lock.json mcm-app/app.json \
            mcm-app/app.config.ts mcm-app/eas.json \
            mcm-app/patches/ mcm-app/plugins/ mcm-app/modules/ mcm-app/targets/)

          if [ -z "${NATIVE_CHANGES}" ]; then
            echo "Sin cambios en rutas nativas → la OTA puede publicarse."
            exit 0
          fi

          if git log --format=%B "${BEFORE}".."${AFTER}" | grep -q '\[skip-ota\]'; then
            echo "Cambios en rutas nativas + [skip-ota] presente en el push → se salta la OTA."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::error::Cambios en rutas nativas SIN [skip-ota] en ningún commit del push. Publicar esta OTA puede crashear la base instalada: haz build de tienda, o marca el commit con [skip-ota]."
          echo "${NATIVE_CHANGES}"
          exit 1

  # Nada llega a los dispositivos sin pasar typecheck + lint + tests.
  verify:
    uses: ./.github/workflows/verify.yml

  publish-prod:
    needs: [guard-native, verify]
    if: needs.guard-native.outputs.skip != 'true'
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }} # yamllint disable-line
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      EXPO_PUBLIC_FIREBASE_DATABASE_URL: ${{ secrets.EXPO_PUBLIC_FIREBASE_DATABASE_URL }}
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
      EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
      EXPO_PUBLIC_CORS_PROXY_URL: ${{ secrets.EXPO_PUBLIC_CORS_PROXY_URL }}
      # Client IDs de Google Sign-In: deben ir también en la OTA porque las
      # variables EXPO_PUBLIC_* se hornean en el bundle JS. Sin esto, cada OTA
      # dejaba el login nativo con client IDs = undefined y no abría (no son
      # secretos: van embebidos en la app igualmente).
      EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: 333436090762-mimunbdpp07nv2hr8mvc2u52ncgrlsr3.apps.googleusercontent.com
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 333436090762-tl5ltg6f1ad7lrqtbs3jq3ae2uu3v0sr.apps.googleusercontent.com
      # Sentry: por lo mismo. El DSN se hornea en el bundle, así que si falta
      # aquí la primera OTA APAGA el crash reporting de la build de tienda sin
      # avisar. El DSN no es un secreto (va dentro de la app igualmente), pero
      # se guarda como secret de GitHub para no publicarlo en el repo.
      EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
      # Aptabase: idéntico razonamiento — si falta aquí, la primera OTA apaga
      # la analítica en toda la base instalada.
      EXPO_PUBLIC_APTABASE_KEY: ${{ secrets.EXPO_PUBLIC_APTABASE_KEY }}
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mcm-app/package-lock.json

      - name: Verificar que EXPO_TOKEN existe
        run: |
          if [ -z "${EXPO_TOKEN}" ]; then
            echo "::error::EXPO_TOKEN no está configurado en los secrets del repositorio"
            exit 1
          fi

      - name: Instalar EAS CLI
        # Pineado a propósito — subir deliberadamente, no usar @latest (una
        # major nueva del CLI podría romper esta OTA de PRODUCCIÓN sin
        # ningún cambio en el repo, y dos runs del mismo commit se
        # comportarían distinto).
        run: npm install -g eas-cli@21.0.2

      - name: Instalar dependencias
        working-directory: ./mcm-app
        run: npm ci

      - name: Verificar autenticación
        run: eas whoami

      - name: Preparar mensaje de update
        id: msg
        run: |
          COMMIT_MSG="$(git log -1 --pretty=%s)"
          # Truncamos a 200 chars para que quepa en EAS Update
          SHORT_MSG="${COMMIT_MSG:0:200}"
          echo "message=🚀 ${SHORT_MSG} (${GITHUB_SHA:0:7})" >> "$GITHUB_OUTPUT"

      - name: Publicar OTA en production
        working-directory: ./mcm-app
        run: |
          eas update \
            --branch production \
            --platform all \
            --message "${{ steps.msg.outputs.message }}" \
            --non-interactive
